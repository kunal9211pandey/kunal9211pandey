<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="p-title p-desc">
<title id="p-title">Featured projects</title>
<desc id="p-desc">Four softly colored project cards: a generative diffusion model for CFD, an end-to-end machine learning portfolio, LeetCode solutions, and GeeksforGeeks solutions.</desc>
<defs>
  <linearGradient id="p-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#60a5fa"/>
    <stop offset=".52" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="p-dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#cbd5e1" fill-opacity=".08"/>
  </pattern>
  <linearGradient id="p-blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#10243a"/>
    <stop offset="1" stop-color="#0c1424"/>
  </linearGradient>
  <linearGradient id="p-violet" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#211a38"/>
    <stop offset="1" stop-color="#101426"/>
  </linearGradient>
  <linearGradient id="p-orange" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#302116"/>
    <stop offset="1" stop-color="#171622"/>
  </linearGradient>
  <linearGradient id="p-green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#123027"/>
    <stop offset="1" stop-color="#101a23"/>
  </linearGradient>
  <clipPath id="p-clip"><rect width="1000" height="570" rx="28"/></clipPath>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .title{font-size:21px;font-weight:700;fill:#eef2ff}
    .desc{font-size:15px;fill:#b8c4da}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px}
    .chip{font-size:12px;font-weight:600}
    .metric{font-size:13px;font-weight:700}
  </style>
</defs>
<g clip-path="url(#p-clip)">
  <rect width="1000" height="570" fill="#070b16"/>
  <rect width="1000" height="570" fill="url(#p-dots)"/>
  <circle cx="140" cy="150" r="230" fill="#247bff" opacity=".055"/>
  <circle cx="865" cy="390" r="260" fill="#a855f7" opacity=".05"/>
  <text x="38" y="48" fill="#eef2ff" font-size="27" font-weight="750">Featured Projects</text>
  <text x="39" y="75" fill="#94a3b8" font-size="14">A selection of work across generative AI, machine learning, and problem solving.</text>

  <g>
    <rect x="30" y="100" width="458" height="202" rx="18" fill="url(#p-blue)" stroke="#60a5fa" stroke-opacity=".48"/>
    <path d="M49 101h420" stroke="#60a5fa" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    <text class="eyebrow" x="52" y="128" fill="#7dd3fc">01  /  GENERATIVE AI</text>
    <text class="title" x="52" y="160">Diffusion for 3D CFD</text>
    <text class="desc" x="52" y="190">Predicts wind flow around 3D buildings without</text>
    <text class="desc" x="52" y="212">rerunning the CFD solver.</text>
    <rect x="52" y="232" width="74" height="24" rx="12" fill="#123b4f"/>
    <text class="chip" x="89" y="248" text-anchor="middle" fill="#bae6fd">PyTorch</text>
    <rect x="134" y="232" width="87" height="24" rx="12" fill="#332453"/>
    <text class="chip" x="177.5" y="248" text-anchor="middle" fill="#ddd6fe">Diffusion</text>
    <rect x="229" y="232" width="53" height="24" rx="12" fill="#203963"/>
    <text class="chip" x="255.5" y="248" text-anchor="middle" fill="#bfdbfe">CFD</text>
    <text class="metric" x="52" y="280" fill="#e2e8f0">318 cases</text>
    <circle cx="129" cy="276" r="2" fill="#64748b"/>
    <text class="metric" x="141" y="280" fill="#86efac">95% accuracy</text>
    <text x="438" y="280" text-anchor="end" fill="#94a3b8" font-size="11">PRIVATE WORK</text>
  </g>

  <g>
    <rect x="512" y="100" width="458" height="202" rx="18" fill="url(#p-violet)" stroke="#a78bfa" stroke-opacity=".48"/>
    <path d="M531 101h420" stroke="#a78bfa" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    <text class="eyebrow" x="534" y="128" fill="#c4b5fd">02  /  MACHINE LEARNING</text>
    <text class="title" x="534" y="160">End-to-End ML/DL Portfolio</text>
    <text class="desc" x="534" y="190">Hands-on projects spanning EDA, machine learning,</text>
    <text class="desc" x="534" y="212">deep learning, and natural language processing.</text>
    <rect x="534" y="232" width="68" height="24" rx="12" fill="#203963"/>
    <text class="chip" x="568" y="248" text-anchor="middle" fill="#bfdbfe">Python</text>
    <rect x="610" y="232" width="119" height="24" rx="12" fill="#332453"/>
    <text class="chip" x="669.5" y="248" text-anchor="middle" fill="#ddd6fe">Machine learning</text>
    <rect x="737" y="232" width="117" height="24" rx="12" fill="#203963"/>
    <text class="chip" x="795.5" y="248" text-anchor="middle" fill="#bfdbfe">Deep learning</text>
    <rect x="862" y="232" width="48" height="24" rx="12" fill="#123b4f"/>
    <text class="chip" x="886" y="248" text-anchor="middle" fill="#bae6fd">NLP</text>
    <text x="534" y="280" fill="#c4b5fd" font-size="13" font-weight="650">EXPLORE THE PORTFOLIO  ↗</text>
  </g>

  <g>
    <rect x="30" y="324" width="458" height="202" rx="18" fill="url(#p-orange)" stroke="#fdba74" stroke-opacity=".48"/>
    <path d="M49 325h420" stroke="#fdba74" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    <text class="eyebrow" x="52" y="352" fill="#fdba74">03  /  PROBLEM SOLVING</text>
    <text class="title" x="52" y="384">LeetCode DSA Solutions</text>
    <text class="desc" x="52" y="414">Data structures and algorithms practice for</text>
    <text class="desc" x="52" y="436">stronger problem-solving fundamentals.</text>
    <rect x="52" y="456" width="80" height="24" rx="12" fill="#49301a"/>
    <text class="chip" x="92" y="472" text-anchor="middle" fill="#fed7aa">LeetCode</text>
    <rect x="140" y="456" width="115" height="24" rx="12" fill="#49301a"/>
    <text class="chip" x="197.5" y="472" text-anchor="middle" fill="#fed7aa">Algorithms</text>
    <text x="52" y="504" fill="#fdba74" font-size="13" font-weight="650">EXPLORE SOLUTIONS  ↗</text>
  </g>

  <g>
    <rect x="512" y="324" width="458" height="202" rx="18" fill="url(#p-green)" stroke="#6ee7b7" stroke-opacity=".48"/>
    <path d="M531 325h420" stroke="#6ee7b7" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    <text class="eyebrow" x="534" y="352" fill="#6ee7b7">04  /  PROBLEM SOLVING</text>
    <text class="title" x="534" y="384">GeeksforGeeks DSA Solutions</text>
    <text class="desc" x="534" y="414">Solutions to core data structures and algorithm</text>
    <text class="desc" x="534" y="436">problems from GeeksforGeeks.</text>
    <rect x="534" y="456" width="112" height="24" rx="12" fill="#1b4939"/>
    <text class="chip" x="590" y="472" text-anchor="middle" fill="#a7f3d0">GeeksforGeeks</text>
    <rect x="654" y="456" width="48" height="24" rx="12" fill="#1b4939"/>
    <text class="chip" x="678" y="472" text-anchor="middle" fill="#a7f3d0">DSA</text>
    <text x="534" y="504" fill="#6ee7b7" font-size="13" font-weight="650">EXPLORE SOLUTIONS  ↗</text>
  </g>

  <rect x=".75" y=".75" width="998.5" height="568.5" rx="28" fill="none" stroke="url(#p-border)" stroke-width="1.5"/>
</g>
</svg>
